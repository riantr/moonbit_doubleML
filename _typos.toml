# typos configuration for moonbit_doubleML
#
# Mirrors moonbit-community/rabbita's _typos.toml layout: per-file
# extends for fixtures, plus a small extend-words list for
# domain-specific terms.

[files]
extend-exclude = [
  # Python reference output — exact byte-for-byte upstream numbers
  "validate_*_with_python.py",
  # Long-form synthetic-DGP seeds; not human prose
  "*.mbt.archived",
  # Upstream issue drafts (preserve exact upstream text)
  "_verify/UPSTREAM_*.md",
  # CHANGELOG historical entries — preserve names as written
  "CHANGELOG.md",
  # The same text one step earlier in its life: `_changelog_<ver>.md` is the
  # entry staged for splicing into CHANGELOG.md by _splice_changelog_<ver>.py.
  # Excluding the destination while scanning the source would spell-check a
  # document out of the state it is destined for, so these are excluded for
  # the same reason and with the same wording.
  "_verify/_changelog_*.md",
  # Upstream `doubleml/double_ml_*.py` sources copied VERBATIM into
  # _verify/ for provenance. They are evidence, not our text: correcting
  # a typo inside a copy would make it stop matching what we read, which
  # is the only reason the copy exists. This is why `agregate` at
  # _verify/double_ml_score_mixins.py:117 is left as upstream has it.
  "_verify/double_ml_*.py",
  # The `doubleml-0.11.4` sdist unpacked VERBATIM into
  # _verify/_upstream_ps/ so v0.119.0 could call upstream's own
  # `_normalize_ipw` / `PSProcessor` as an oracle. Same reasoning as the
  # `double_ml_*.py` copies above and the same reference: this tree is
  # evidence about what upstream says, and correcting a typo inside it
  # would change what the oracle computes while leaving its name in the
  # log. `blp.py`'s "cofidence" and `test_framework.py`'s "substract"
  # are upstream's typos and are left as they are.
  "_verify/_upstream_ps/**",
  # The upstream `rdpackages/rdrobust` PYTHON PORT, downloaded VERBATIM into
  # _verify/_upstream_rdrobust_py/ and copied again into _verify/_oracle/ so it
  # is importable as a package. Same reasoning as `double_ml_*.py` above, and
  # the same reference: these files exist because they are what v0.116.0's
  # `nn_residual` and procedure (iii) sandwich were read from. Editing a typo
  # inside them would not make them more correct -- it would make them stop
  # being the thing that was read.
  #
  # `_verify/gen_v116_oracle.py` is deliberately NOT excluded: that one is ours.
  "_verify/_upstream_rdrobust_py/*.py",
  "_verify/_oracle/**/*.py",
  # Commit-message records kept under _verify/ are verbatim copies of what
  # was actually committed. Same reasoning as the copies above, with a
  # stricter reference: `git log` is the ground truth, so editing the text
  # to satisfy the spell check would make it stop matching the commit it
  # documents. `_commit_msg_rel_ci.txt:16` quotes the `agregate` finding
  # verbatim while explaining why it was NOT corrected -- the word is the
  # subject of the paragraph.
  "_verify/_commit_msg_*.txt",
]

[default.extend-words]
# doubleml-for-py upstream module names — preserve as-is
apos = "apos"
ndout = "ndout"
pava = "pava"
CAUSAL = "CAUSAL"
DML = "DML"
dml = "dml"

# Econometric terminology — "complier" / "compliers" are the
# standard Imbens-Angrist terms for IV/LATE subjects who take
# the treatment they were assigned to. Not a misspelling of
# "compiler" / "compilers".
compliers = "compliers"
complier = "complier"
Complier = "Complier"

# Internal MoonBit variable names that look like typos to the
# English-word dictionary but are intentional. `iy` is the
# LPQ in-sample index for the bisection search; `lik` is the
# cholesky inner-product accumulator.
iy = "iy"
lik = "lik"

# `levl` / `levr` are the left / right leverage profiles returned by the
# WLS side fit and are always written as a PAIR. Spelling them out
# would break the symmetry that makes the pair readable, and "level" is
# the wrong noun here anyway -- these are leverage vectors, not levels.
# `levl` alone reads as a typo to the dictionary because it collides with
# "level"; that collision is why it is listed rather than renamed.
levl = "levl"
levr = "levr"

# `unparseable` is a valid English spelling (per Merriam-Webster
# and Wiktionary). `mis` is the 3-letter abbreviation used in
# the v0.x release-table columns ("mis|fix|summary") so the
# columns align vertically. Both preserved as-is.
unparseable = "unparseable"
mis = "mis"
