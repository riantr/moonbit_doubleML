# typos configuration for moonbit_doubleML
#
# Mirrors moonbit-community/rabbita's _typos.toml layout: per-file
# extends for fixtures, plus a small extend-words list for
# domain-specific terms.

[files]
extend-exclude = [
  # Python reference output — exact byte-for-byte upstream numbers
  "validate_*_with_python.py",
  # Long-form synthetic-DGP seeds; not human prose
  "*.mbt.archived",
  # Upstream issue drafts (preserve exact upstream text)
  "_verify/UPSTREAM_*.md",
  # CHANGELOG historical entries — preserve names as written
  "CHANGELOG.md",
  # Upstream `doubleml/double_ml_*.py` sources copied VERBATIM into
  # _verify/ for provenance. They are evidence, not our text: correcting
  # a typo inside a copy would make it stop matching what we read, which
  # is the only reason the copy exists. This is why `agregate` at
  # _verify/double_ml_score_mixins.py:117 is left as upstream has it.
  "_verify/double_ml_*.py",
]

[default.extend-words]
# doubleml-for-py upstream module names — preserve as-is
apos = "apos"
ndout = "ndout"
pava = "pava"
CAUSAL = "CAUSAL"
DML = "DML"
dml = "dml"

# Econometric terminology — "complier" / "compliers" are the
# standard Imbens-Angrist terms for IV/LATE subjects who take
# the treatment they were assigned to. Not a misspelling of
# "compiler" / "compilers".
compliers = "compliers"
complier = "complier"
Complier = "Complier"

# Internal MoonBit variable names that look like typos to the
# English-word dictionary but are intentional. `iy` is the
# LPQ in-sample index for the bisection search; `lik` is the
# cholesky inner-product accumulator.
iy = "iy"
lik = "lik"

# `levl` / `levr` are the left / right leverage profiles returned by the
# WLS side fit and are always written as a PAIR. Spelling them out
# would break the symmetry that makes the pair readable, and "level" is
# the wrong noun here anyway -- these are leverage vectors, not levels.
# `levl` alone reads as a typo to the dictionary because it collides with
# "level"; that collision is why it is listed rather than renamed.
levl = "levl"
levr = "levr"

# `unparseable` is a valid English spelling (per Merriam-Webster
# and Wiktionary). `mis` is the 3-letter abbreviation used in
# the v0.x release-table columns ("mis|fix|summary") so the
# columns align vertically. Both preserved as-is.
unparseable = "unparseable"
mis = "mis"
