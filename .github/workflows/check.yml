name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel any in-flight run for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  moon-test:
    name: moon test --deny-warn
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [native, wasm-gc, wasm, js]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update dependencies
        run: |
          moon version --all
          moon update

      - name: Build
        run: moon build --target ${{ matrix.target }} --deny-warn

      - name: Test
        run: moon test --target ${{ matrix.target }} --deny-warn

      - name: Format check
        run: moon fmt --check

  python-cross-check:
    name: Python cross-check
    runs-on: ubuntu-latest
    needs: moon-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # doubleml + numpy + pandas + statsmodels + scikit-learn
          pip install doubleml numpy pandas statsmodels scikit-learn

      - name: Run all 9 validate_*.py scripts
        run: |
          set -e
          for s in validate_*_with_python.py; do
            echo "=== $s ==="
            python "$s" | tail -1
          done
