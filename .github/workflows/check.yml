name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel any in-flight run for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This runs BEFORE everything else and needs no toolchain, because the thing
  # it protects against is invisible to every other check.
  #
  # `moon.mod` sits in moonbit_doubleML/ and declares `readme = "README.mbt.md"`,
  # which resolves RELATIVE TO THE PACKAGE DIR -- so moon publish, and therefore
  # the mooncakes.io page, renders moonbit_doubleML/README.mbt.md, NOT the
  # README.mbt.md a human edits at the repo root.
  #
  # Those two files drifted for 44 versions: the shipped one was still at
  # v0.115.0 / 855 tests while the repo was at v0.159.0 / 1120. Nothing failed,
  # because nothing compared them -- tests, fmt, typos and the Python
  # cross-checks all pass on a repo whose published README is wrong.
  readme-sync:
    name: README sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Shipped README matches the edited README
        run: python3 .github/scripts/check_readme_sync.py

  moon-test:
    name: moon test --deny-warn
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [native, wasm-gc, wasm, js]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update dependencies
        run: |
          moon version --all
          moon update

      - name: Build
        run: moon build --target ${{ matrix.target }} --deny-warn

      - name: Test
        run: moon test --target ${{ matrix.target }} --deny-warn

      - name: Format check
        run: moon fmt --check

  python-cross-check:
    name: Python cross-check
    runs-on: ubuntu-latest
    needs: moon-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Four validators (did / iivm / irm / pliv) shell out to
      # `moon run --target native examples/main` and parse its stdout, so
      # this job needs the MoonBit toolchain even though it does not
      # otherwise build anything.
      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update dependencies
        run: |
          moon version --all
          moon update

      # The published README is a document a reader COPIES from, so its own
      # code blocks have to compile.  Until round 43 nothing checked that:
      # two of the blocks did not compile, and the README's verifier could
      # not see it -- it checks the NAMES of a call's arguments, and a type
      # mismatch is not a name.  This verifier writes the blocks into a probe
      # file inside `doc/001_introduction/` (whose `moon.pkg` imports the
      # library WITHOUT a version, so the workspace resolves it to THIS
      # tree) and runs `moon check` on it.  The probe is removed again.
      - name: Compile the published README's code blocks
        run: python3 _verify/_verify_readme_snippets_1650.py

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # doubleml + numpy + pandas + statsmodels + scikit-learn
          # rdrobust: the RDD upstream reference (`pyexample_rdd.py`). Pinning
          # the major is deliberate -- its bias-corrected estimator is a dense
          # linear-algebra port, so a version bump can move tau.bc in the last
          # few digits and turn a machine-precision gate red for no real reason.
          pip install doubleml numpy pandas statsmodels scikit-learn "rdrobust>=2,<3"

      # No count in the step name: the glob below is the source of truth, and
      # a hardcoded count went stale twice (23 -> 24) while the run itself was
      # unaffected -- which is worse than no number at all, because it looks
      # maintained.
      - name: Run every validate_*_with_python.py script
        run: |
          set -e
          fail=0
          count=0
          for s in validate_*_with_python.py; do
            echo "=== $s ==="
            count=$((count + 1))
            # Capture stdout AND the exit code separately.
            #
            # The previous form was `line="$(python "$s" | tail -1)"`. Under a
            # bare `set -e`, a pipeline's status is its LAST command's, so
            # python's non-zero exit was invisible and the trailing-PASS line
            # was the only gate. That is a weaker gate than it looks: all ten
            # scripts that could not spawn MoonBit printed a PASS-looking line
            # and passed it, which is exactly the failure this step appeared
            # to be protecting against.
            out="$(python "$s")" || {
              echo "::error::${s} exited non-zero"
              fail=1
              continue
            }
            line="$(printf '%s\n' "$out" | tail -1)"
            echo "$line"
            case "$line" in
              *PASS*) ;;
              *) echo "::error::${s} trailing line did not contain PASS"; fail=1 ;;
            esac
          done
          echo "ran ${count} validator(s)"
          if [ "$fail" -ne 0 ]; then
            echo "One or more validators failed."
            exit 1
          fi

      # The only cross-check whose reference is UPSTREAM's rather than ours:
      # it regenerates `doubleml.did.datasets.make_did_SZ2020`, runs upstream's
      # own `DoubleMLDID` on it, and compares the MoonBit port to that.
      #
      # Separate step, and NOT part of the loop above, because it writes a
      # generated dataset into examples/parity/pyexample_data.mbt and restores
      # it. A mutating step inside a read-only loop would leave the checkout
      # dirty for every subsequent iteration if it died mid-run.
      #
      # There is deliberately NO `git status --porcelain` guard here. An
      # earlier version had one and it was the thing that failed: the CI
      # simulator materialises this tree with `git archive`, which has no
      # `.git`, so the guard had nothing to ask and went red on a run whose
      # gate had passed. The gate already restores the fixture from an
      # in-memory byte snapshot and asserts the bytes match, exiting non-zero
      # if they do not -- a strictly stronger check than a dirty-tree string,
      # and one that does not care whether a VCS is present. Duplicating a
      # strong check with a weaker, environment-dependent one only adds a
      # failure mode and no signal.
      - name: Compare the port against upstream's own Python example
        run: |
          set -e
          python pyexample_did.py --check

      # The MULTI-COHORT half, on upstream's `DoubleMLDIDMulti` and
      # `make_did_CS2021`. This is where the port's DID-CS machinery lives;
      # the step above covers the single-cohort `DoubleMLDID`.
      #
      # This step did not exist until v0.164.0 because an earlier revision of
      # `pyexample_did.py` documented two reasons to skip CS2021 -- "upstream
      # has no CS2021 estimator" and "the never-treated conventions disagree" --
      # and BOTH were measured false. Upstream ships `DoubleMLDIDMulti`, and
      # `_get_never_treated_value` returns `0` for integer `g`, which is exactly
      # this port's own rule. The refusal cost real coverage: 6 post-treatment
      # ATT cells per cohort, on upstream's dataset, were ungated.
      #
      # Same structural constraints as the step above: separate step (it
      # writes a generated panel into the shared fixture and restores it),
      # restore from an in-memory byte snapshot, no git-status guard.
      - name: Compare the multi-cohort port against upstream's CS2021 example
        run: |
          set -e
          python pyexample_did_cs2021.py --check

      # The core estimator family: PLR, IRM, SSM, BLP, PLIV and IIVM on three
      # numpy datasets. Before this step, six estimators shipped with no
      # upstream comparison at all -- the two steps above are both DID.
      #
      # Same structural constraints: separate step, because it writes a
      # generated dataset into `examples/parity/suite_data.mbt` and restores it,
      # restore from an in-memory byte snapshot, no git-status guard.
      #
      # Every fit is re-seeded immediately before it is built. Upstream calls
      # `check_random_state(None)`, which returns the PROCESS-global
      # `np.random.mtrand._rand`, so a single per-batch seed would tie each
      # fold draw to every random number consumed before it -- an unrelated
      # estimator being added or removed would move this gate's reference.
      - name: Compare the core estimator family against upstream
        run: |
          set -e
          python pyexample_suite.py --check

      # `DoubleMLDIDCSBinary` -- the class `examples/did_cs_binary` builds.
      # Distinct from the CS2021 step above, which grades
      # `DoubleMLDIDMulti`: different class, different defaults, and
      # agreement with one is not evidence about the other.
      #
      # Unlike both DID gates above, NO cell is skipped for structural
      # reasons. Both constructors take an explicit
      # `(g_value, t_value_pre, t_value_eval)`, so all 6 comparable cells are
      # compared rather than the subset where two grid-derivation rules
      # happen to coincide.
      #
      # Upstream's `DoubleMLDIDCS` is deliberately NOT used: it is deprecated
      # ("will be removed with version 0.12.0") and refuses DoubleMLPanelData.
      # It writes the same `cs2021_*` fixture block the step above does, so
      # the two must not run concurrently against one working tree.
      - name: Compare the binary DID-CS port against upstream
        run: |
          set -e
          python pyexample_did_cs_binary.py --check

      # `DoubleMLDIDBinary` -- the class `examples/did_binary` builds, and the
      # third DID class. Distinct from both steps above: a different upstream
      # class with a different construction (the port converts the panel to a
      # WIDE cross-section first and fits an inner `DoubleMLDID`, whereas
      # `DoubleMLDIDMulti` and `DoubleMLDIDCSBinary` consume the panel), so
      # agreement with either is not evidence about it.
      #
      # This gate is also the CORRECTION of a recorded defect.
      # `_verify/DID_BINARY_PANIC_1680.md` claimed the port aborts on the CS2021
      # panel because the eligible subset is smaller than `n_folds`. That was
      # wrong: the subset is 515 rows, and `n_folds` 2/3/4 all construct AND fit
      # (coef 1.1448 / 1.1461 / 1.1187 against upstream's 1.1386). `n_folds = 5`
      # aborts during CONSTRUCTION, before preprocessing runs, because
      # `DoubleMLDIDBinary::new` builds a 4-row dummy inner model so that
      # construction cannot trip `require(n_folds <= n_obs)` -- a CONSTANT
      # ceiling, not a property of the sample.
      #
      # Both sides are fitted at `n_folds = 2`, under that ceiling. Writes the
      # same `cs2021_*` fixture block as the two DID steps above, so it needs
      # its own step rather than sharing one.
      - name: Compare the binary DID port against upstream
        run: |
          set -e
          python pyexample_did_binary.py --check

      # `DoubleMLLPLR` -- the class `examples/lplr` builds. Distinct from
      # every step above: not a DID class at all, and the only gate here that
      # compares on SHARED ROWS AND A SHARED OUTER PARTITION.
      #
      # WHY IT EXISTS, since `validate_lplr_with_python.py` already compares
      # LPLR to upstream. That comparison fits upstream on a numpy DGP and
      # compares it against the example's `chacha8_rng` numbers -- two
      # different datasets -- then attributes the gap to upstream noise and
      # widens the band to `3 * max(se)` (~0.81 here). Measured on FIXED data
      # with only the partition redrawn, the fold draw moves theta by sd
      # 0.308, so the width is legitimate; but spending it on a data mismatch
      # meant no estimator-level difference below ~0.6 was visible. Measured
      # in `_verify/LPLR_GATE_BLINDNESS_1680.md`.
      #
      # This gate removes both sources instead of absorbing them: the emitter
      # prints the example's own rows and the partition `fit` drew, and
      # upstream is pinned to them. Refitting upstream under a pinned
      # partition is bit-identical (|dcoef| = 0.000e+00). What remains is the
      # INNER split, which `set_sample_splitting` does not cover on the port
      # side (`lplr.mbt:1630`), so both sides' inner spreads are measured and
      # the band is built from them.
      - name: Compare the LPLR port against upstream on shared rows
        run: |
          set -e
          python pyexample_lplr.py --check

      # PQ / QTE -- the quantile estimators on `examples/main`, which carried
      # an ANALYTIC oracle only until now.
      #
      # A different comparison SHAPE from the six gates above: nothing is
      # emitted and no partition is pinned, because the DGP is integer
      # arithmetic only. Both sides build the arrays from the same modulo
      # formulas and a per-column fingerprint is compared, so this is two
      # independent constructions of the same rows -- the stronger shape the
      # parity emitter's header describes. A transcription slip on either
      # side shows up as a mismatch instead of cancelling out.
      #
      # Coefficients are gated on the measured seed spread. The standard
      # errors are gated on a RATIO envelope instead, and the reason is
      # measured rather than stylistic: the port's SE sits BELOW upstream's
      # on the four PQ/QTE quantities -- ratios 0.9818, 0.9074, 0.9671 and
      # 0.9442 -- whose seed spread is ~1e-4, and ABOVE it on LPQ (1.2523),
      # so the direction is not even consistent. That is why the envelope
      # spans both directions rather than being per-quantity: a per-quantity
      # envelope always contains its own measured value, so it cannot fail.
      # Both candidate causes for the PQ/QTE offset were measured and ruled
      # out -- `trimming` does not bind on this DGP, and `normalize_ipw`
      # moves the gap the WRONG way. Details in `pyexample_pq.py` and
      # `_verify/PQ_QTE_SE_GAP_1680.md`.
      - name: Compare the quantile port against upstream
        run: |
          set -e
          python pyexample_pq.py --check

      # PolicyTree -- the fifth and last of the slots that shipped with an
      # ANALYTIC oracle only. PQ/QTE/LPQ are the step above; RDD is the step
      # below, gated on the bias-corrected arm after the recorded divergence
      # turned out to have been measured on a noiseless design.
      #
      # Upstream's signature is `DoubleMLPolicyTree(orth_signal, features,
      # depth=2, ...)`, so the argument order is REVERSED relative to the
      # port and upstream's default depth is 2 while the port's is 1 -- depth
      # is pinned on both sides rather than left to defaults. `random_state`
      # is pinned too: without it upstream is non-deterministic, and two fits
      # in one process returned different trees.
      #
      # Nothing STRUCTURAL is compared. The port implements its own builder
      # and upstream wraps a `DecisionTreeClassifier`; they differ in threshold
      # convention, criterion and leaf rule, and on a two-column design those
      # differences put 10 of 300 rows in different leaves. What is compared is
      # the LABEL VECTOR over every row -- invariant to all of it -- plus the
      # split feature and the threshold. The threshold rides a bound because
      # sklearn stores it as float32: measured gap 4.75e-8 relative, bound
      # 1e-6. A battery arm perturbs it 1e-4 to prove that bound can go red.
      - name: Compare the policy tree against upstream
        run: |
          set -e
          python pyexample_policytree.py --check

      # RDD against rdrobust. The bias-corrected arm is GATED: the port agrees
      # with upstream to 6.2e-15 on tau.bc and 1.9e-15 on se.rb (bound 1e-11).
      # The shipped default arm is homoskedastic and uncorrected -- a different
      # estimator from rdrobust's default -- so it is printed beside the gate
      # rather than gated. A battery of six arms in
      # `_verify/_rdd_battery_1680.py` perturbs the emitter to prove the bound
      # can go red, the fingerprint can go red, and a missing row fails closed.
      - name: Compare RDD against upstream rdrobust
        run: |
          set -e
          python pyexample_rdd.py --check

  # The 22 QA activities were, until v0.162.0, an inventory rather than
  # something you could run. This job runs the fast scope of that harness on
  # every push and PR.
  #
  # It is deliberately NOT --full. Most of the full scope re-measures what the
  # jobs above already measure: `unit_tests` and `component_tests` re-run
  # `moon test` (4 backends, above), `integration` re-runs all 24 Python
  # cross-checks (`python-cross-check`, above), and `static_analysis` re-runs
  # `moon check --deny-warn` (which publish.yml already does before it
  # publishes). Re-doing them here would multiply release time to re-measure
  # what is already measured.
  #
  # The full scope is NOT a release-time scope, though, and this job is where
  # that becomes visible. Of the 9 full-scope checks, only `api_test` and
  # `security_dast` are run anywhere in CI -- the last step of this job pulls
  # them out explicitly. `fuzz`, `mutation` and `load_stress` run in no
  # workflow at all, and `integration` adds one property nothing else has:
  # that each of the 24 validators actually spawned MoonBit, which
  # `python-cross-check` does not require. So the honest count is 2 of 9
  # full-scope checks in CI, not 9.
  #
  # What this job adds that nothing else covers: duplicate-code detection, the
  # dependency audit, Gherkin -> test traceability, validate_splitting_contract
  # (tracked but matched by no CI glob until now), a test-coverage proxy, and
  # the harness's own self-test.
  #
  # --allow-inert: it is a policy for the INERT verdict, not an assertion that
  # `moon fmt --check` is inert. The harness re-measures that with its own
  # control arm rather than taking it on faith, and on moon 0.1.20261028 the
  # arm shows the check DOES turn red on a mis-formatted file (a clean copy
  # of examples/main exits 0; the same copy with one bad function exits
  # non-zero and names main.mbt). An earlier INERT verdict came from a
  # control arm that pointed the tool at a directory with no package in it --
  # see .github/scripts/qa_loop/checks.py. --allow-inert is kept so that a
  # future toolchain regression, which would report INERT, cannot turn every
  # run red for a reason unrelated to the code; a permanently-red build is a
  # build everyone learns to ignore. The verdict is still printed, and
  # selftest T20 pins that --allow-inert can never mask a real FAIL.
  qa-loop:
    name: QA loop
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TYPOS_VERSION: v1.19.0
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      # Pinned to the same version publish.yml uses, so the spell-check verdict
      # in this job and the release gate come from one dictionary.
      - name: Install typos
        run: |
          mkdir -p "${CARGO_HOME:-$HOME/.cargo}/bin"
          curl -LsSf "https://github.com/crate-ci/typos/releases/download/${TYPOS_VERSION}/typos-${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> $GITHUB_PATH

      # The nine `pyexample_*` checks in the fast scope are PORT-vs-UPSTREAM
      # gates: they import numpy, pandas, scikit-learn and doubleml from the
      # emitted rows. This job had no dependency install, so every one of them
      # died in 0.03s with `ModuleNotFoundError: No module named 'numpy'`.
      #
      # It went unseen because these checks are NEW: at 465431c -- the last CI
      # run on this repo that was green -- checks.py had ZERO `c_pyexample*`
      # functions. They arrived in d3ac364 ("gate DoubleMLLPLR on shared rows
      # and a pinned partition"), so the run that reported this failure was the
      # first CI execution these gates ever had. Locally they always passed,
      # because a developer machine already has numpy; the job that runs them
      # on CI did not.
      #
      # Same install line as `python-cross-check`, so the two jobs cannot drift
      # into disagreeing about what the port is compared against.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install doubleml numpy pandas statsmodels scikit-learn "rdrobust>=2,<3"

      - name: Update dependencies
        run: |
          moon version --all
          moon update

      # The harness must be able to fail before its verdict is worth anything,
      # so the self-test gates this job too.
      - name: Self-test the harness
        run: python3 .github/scripts/qa_loop/selftest.py

      - name: QA loop (fast scope)
        run: python3 .github/scripts/qa_loop/run.py --allow-inert --json qa_loop.json

      # The two SERVICE checks, pulled out of the full scope explicitly.
      #
      # `api_test` and `security_dast` are the only checks that boot
      # `examples/api_server` and speak HTTP to it, so they are the only ones
      # that can catch drift in what the service advertises. They are full
      # scope, and NEITHER this workflow nor publish.yml passes `--full` -- so
      # they were running nowhere.
      #
      # Measured consequence: `api_test` was FAILING on this tree. The service
      # advertised `riantr/moonbit_doubleML@0.162.0` while moon.mod said
      # 0.163.0, i.e. the v0.163.0 version bump had missed the literal in
      # `examples/api_server/main.mbt`, and no red build said so.
      #
      # This is NOT `--full`. Full re-runs `moon test` several more times and
      # all 24 Python cross-checks, which the two jobs above already do on four
      # backends. These two checks cost ~16s each and cover a surface nothing
      # else in this workflow touches.
      - name: QA loop (service checks)
        run: |
          python3 .github/scripts/qa_loop/run.py --allow-inert --full \
            --only api_test,security_dast --json qa_loop_services.json
