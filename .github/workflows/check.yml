name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel any in-flight run for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This runs BEFORE everything else and needs no toolchain, because the thing
  # it protects against is invisible to every other check.
  #
  # `moon.mod` sits in moonbit_doubleML/ and declares `readme = "README.mbt.md"`,
  # which resolves RELATIVE TO THE PACKAGE DIR -- so moon publish, and therefore
  # the mooncakes.io page, renders moonbit_doubleML/README.mbt.md, NOT the
  # README.mbt.md a human edits at the repo root.
  #
  # Those two files drifted for 44 versions: the shipped one was still at
  # v0.115.0 / 855 tests while the repo was at v0.159.0 / 1120. Nothing failed,
  # because nothing compared them -- tests, fmt, typos and the Python
  # cross-checks all pass on a repo whose published README is wrong.
  readme-sync:
    name: README sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Shipped README matches the edited README
        run: python3 .github/scripts/check_readme_sync.py

  moon-test:
    name: moon test --deny-warn
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [native, wasm-gc, wasm, js]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update dependencies
        run: |
          moon version --all
          moon update

      - name: Build
        run: moon build --target ${{ matrix.target }} --deny-warn

      - name: Test
        run: moon test --target ${{ matrix.target }} --deny-warn

      - name: Format check
        run: moon fmt --check

  python-cross-check:
    name: Python cross-check
    runs-on: ubuntu-latest
    needs: moon-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Four validators (did / iivm / irm / pliv) shell out to
      # `moon run --target native examples/main` and parse its stdout, so
      # this job needs the MoonBit toolchain even though it does not
      # otherwise build anything.
      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update dependencies
        run: |
          moon version --all
          moon update

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # doubleml + numpy + pandas + statsmodels + scikit-learn
          pip install doubleml numpy pandas statsmodels scikit-learn

      # No count in the step name: the glob below is the source of truth, and
      # a hardcoded count went stale twice (23 -> 24) while the run itself was
      # unaffected -- which is worse than no number at all, because it looks
      # maintained.
      - name: Run every validate_*_with_python.py script
        run: |
          set -e
          fail=0
          count=0
          for s in validate_*_with_python.py; do
            echo "=== $s ==="
            count=$((count + 1))
            # Capture stdout AND the exit code separately.
            #
            # The previous form was `line="$(python "$s" | tail -1)"`. Under a
            # bare `set -e`, a pipeline's status is its LAST command's, so
            # python's non-zero exit was invisible and the trailing-PASS line
            # was the only gate. That is a weaker gate than it looks: all ten
            # scripts that could not spawn MoonBit printed a PASS-looking line
            # and passed it, which is exactly the failure this step appeared
            # to be protecting against.
            out="$(python "$s")" || {
              echo "::error::${s} exited non-zero"
              fail=1
              continue
            }
            line="$(printf '%s\n' "$out" | tail -1)"
            echo "$line"
            case "$line" in
              *PASS*) ;;
              *) echo "::error::${s} trailing line did not contain PASS"; fail=1 ;;
            esac
          done
          echo "ran ${count} validator(s)"
          if [ "$fail" -ne 0 ]; then
            echo "One or more validators failed."
            exit 1
          fi

  # The 21 QA activities were, until v0.162.0, an inventory rather than
  # something you could run. This job runs the fast scope of that harness on
  # every push and PR.
  #
  # It is deliberately NOT --full. The full scope runs `moon test` several more
  # times (unit_tests, component_tests, and mutation's 3 mutants) and re-runs
  # all 23 Python cross-checks -- all of which the moon-test and
  # python-cross-check jobs above already do, on 4 backends. Re-doing them here
  # would multiply release time to re-measure what is already measured.
  #
  # What this job adds that nothing else covers: duplicate-code detection, the
  # dependency audit, Gherkin -> test traceability, validate_splitting_contract
  # (tracked but matched by no CI glob until now), a test-coverage proxy, and
  # the harness's own self-test.
  #
  # --allow-inert: `moon fmt --check` cannot fail on this toolchain, and the
  # harness proves that with a control arm rather than asserting it. Gating on
  # INERT would turn every run red for a reason unrelated to the code, and a
  # permanently-red build is a build everyone learns to ignore. The verdict is
  # still printed, and selftest T20 pins that --allow-inert can never mask a
  # real FAIL.
  qa-loop:
    name: QA loop
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TYPOS_VERSION: v1.19.0
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      # Pinned to the same version publish.yml uses, so the spell-check verdict
      # in this job and the release gate come from one dictionary.
      - name: Install typos
        run: |
          mkdir -p "${CARGO_HOME:-$HOME/.cargo}/bin"
          curl -LsSf "https://github.com/crate-ci/typos/releases/download/${TYPOS_VERSION}/typos-${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> $GITHUB_PATH

      - name: Update dependencies
        run: |
          moon version --all
          moon update

      # The harness must be able to fail before its verdict is worth anything,
      # so the self-test gates this job too.
      - name: Self-test the harness
        run: python3 .github/scripts/qa_loop/selftest.py

      - name: QA loop (fast scope)
        run: python3 .github/scripts/qa_loop/run.py --allow-inert --json qa_loop.json
