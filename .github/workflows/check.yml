name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel any in-flight run for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  moon-test:
    name: moon test --deny-warn
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [native, wasm-gc, wasm, js]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update dependencies
        run: |
          moon version --all
          moon update

      - name: Build
        run: moon build --target ${{ matrix.target }} --deny-warn

      - name: Test
        run: moon test --target ${{ matrix.target }} --deny-warn

      - name: Format check
        run: moon fmt --check

  python-cross-check:
    name: Python cross-check
    runs-on: ubuntu-latest
    needs: moon-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # doubleml + numpy + pandas + statsmodels + scikit-learn
          pip install doubleml numpy pandas statsmodels scikit-learn

      - name: Run all 23 validate_*_with_python.py scripts
        run: |
          set -e
          fail=0
          for s in validate_*_with_python.py; do
            echo "=== $s ==="
            line="$(python "$s" | tail -1)"
            echo "$line"
            case "$line" in
              *PASS*) ;;
              *) echo "::error::${s} trailing line did not contain PASS"; fail=1 ;;
            esac
          done
          if [ "$fail" -ne 0 ]; then
            echo "One or more validators did not emit a trailing PASS line."
            exit 1
          fi
