name: publish-package
run-name: publish moonbit_doubleML ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

on:
  # v0.113.0: tag-push triggering is back ON.
  #
  # It was disabled at 7186945 ("ci(publish): stop triggering releases on tag
  # push") for two reasons, and only ONE of them was ever the token:
  #
  #   1. MOONCAKES_RIANTR_TOKEN was not set, so every tag push produced a
  #      red run -- 45 of them, all failures. The token IS set now.
  #   2. The last run to reach the end (v0.92.0, 2026-10-05) failed at
  #      `Check typos`, NOT at the token guard -- so the token was never
  #      the only blocker and the recorded reason was incomplete.
  #
  # Cause 2 is fixed: `_typos.toml` now excludes the verbatim upstream
  # `doubleml/double_ml_*.py` copies under `_verify/`, and lists the
  # paired `levl`/`levr` leverage-profile names. `typos` v1.19.0 --
  # the version pinned below -- is clean on the working tree.
  #
  # Releases are now published by THIS workflow. Do not also publish by
  # hand: `moon publish` on an existing version fails, and mooncakes
  # `latest` means "whatever was published last", so a manual publish
  # would leave the registry pointing somewhere the tag order does not
  # suggest.
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v0.52.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-moonbit_doubleML-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: 1
      TYPOS_VERSION: v1.19.0

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Resolve release version
        id: release
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="$GITHUB_REF_NAME"
          fi

          case "$tag" in
            v*) version="${tag#v}" ;;
            *)
              echo "Release tag must use the v* format, got: $tag" >&2
              exit 1
              ;;
          esac

          manifest_version="$(awk -F'"' '/^version = / { print $2; exit }' moonbit_doubleML/moon.mod)"
          if [ "$version" != "$manifest_version" ]; then
            echo "Tag version $version does not match moon.mod version $manifest_version" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: MoonBit version
        run: |
          moon version --all
          moonrun --version

      - name: Update dependencies
        run: moon update

      - name: Check package (all 4 backends, --deny-warn)
        run: |
          for target in native wasm wasm-gc js; do
            echo "::group::moon check --target $target --deny-warn"
            moon check --target "$target" --deny-warn
            echo "::endgroup::"
          done

      - name: Test package (all 4 backends, --deny-warn)
        run: |
          for target in native wasm wasm-gc js; do
            echo "::group::moon test --target $target --deny-warn"
            moon test --target "$target" --deny-warn
            echo "::endgroup::"
          done

      - name: Check generated interfaces
        run: |
          moon info --target js
          git diff --exit-code

      - name: Check formatting
        run: moon fmt --check

      - name: Download typos
        run: curl -LsSf https://github.com/crate-ci/typos/releases/download/$TYPOS_VERSION/typos-$TYPOS_VERSION-x86_64-unknown-linux-musl.tar.gz | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      - name: Check typos
        run: typos

      - name: Publish to Mooncakes
        run: |
          # moon publish exits 255 for "secret missing", "secret has the
          # wrong shape", "publish rejected" and "version already exists",
          # so without a guard the annotation names none of them.
          #
          # WHAT THE SECRET MUST CONTAIN: the JSON BODY of
          # ~/.moon/credentials.json -- an object with non-empty "token"
          # and "username" keys (73 bytes on this account) -- NOT a bare
          # token string. The step below writes $SECRET straight to that
          # path, so a bare token produces a file that does not parse
          # and moon publish fails with an opaque auth error.
          #
          # That is not hypothetical. The workflow this replaced reported
          # "MOONCAKES_RIANTR_TOKEN and MOONCAKES_RIANTR_USERNAME must
          # both be set", which was the shape error in disguise: it needed
          # BOTH values because it was writing the object.
          #
          # Only the "missing" case is checked here. A shape check was
          # tried and REMOVED rather than shipped: this repository has no
          # bash or git-bash available locally, so no shell snippet could
          # be verified before going into the release path, and an
          # unverified guard risks a permanently red run -- the exact
          # failure the 7186945 disablement was about. If the next
          # release dies at auth, check the secret's shape first.
          if [ -z "$SECRET" ]; then
            echo "::error::MOONCAKES_RIANTR_TOKEN is not set on this repository; moon publish cannot authenticate. If it IS set, check its SHAPE: it must be the JSON body of ~/.moon/credentials.json, not a bare token."
            exit 1
          fi
          mkdir -p "$HOME/.moon"
          printf '%s' "$SECRET" > "$HOME/.moon/credentials.json"
          trap 'rm -f "$HOME/.moon/credentials.json"' EXIT
          moon -C moonbit_doubleML publish
        env:
          SECRET: ${{ secrets.MOONCAKES_RIANTR_TOKEN }}

      - name: Create GitHub Release
        run: |
          gh release create "${{ steps.release.outputs.tag }}" \
            --title "moonbit_doubleML ${{ steps.release.outputs.version }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
